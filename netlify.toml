# Configurazione Netlify per il sito Dr. Campa
# Questo file dice a Netlify come pubblicare il sito.

[build]
  publish = "."

# Header anti-cache per content.json e admin
# (evita che il browser mostri vecchi contenuti dopo le modifiche dal CMS)
[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content.en.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache lunga per le immagini: i nomi file contengono un timestamp univoco,
# quindi non cambiano mai. I visitatori di ritorno non le riscaricano.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
